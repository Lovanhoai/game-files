<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J2ME Web Emulator</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    #container { width: 100%; max-width: 400px; text-align: center; }
    iframe { width: 100%; height: 650px; border: none; }
  </style>
</head>
<body>
  <div id="container">
    <iframe id="emu-frame" src=""></iframe>
  </div>

  <script>
    // Tự động lấy tham số file game từ URL (ví dụ: ?game=thachsanh.jar)
    const urlParams = new URLSearchParams(window.location.search);
    const gameFile = urlParams.get('game') || 'thachsanh.jar';
    
    // Nạp game vào Web Emulator
    document.getElementById('emu-frame').src = 'https://m.emuparadise.li/j2me/play.php?jar=' + encodeURIComponent(window.location.origin + window.location.pathname.replace('index.html', '') + gameFile);
  </script>
</body>
</html>
